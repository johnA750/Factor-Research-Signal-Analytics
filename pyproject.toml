[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "equity-signal-platform"
version = "0.1.0"
description = "A Python platform for equity factor research and backtesting."
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "yfinance>=0.2.40",
    "matplotlib>=3.8",
    "plotly>=5.22",
    "streamlit>=1.36",
    "PyYAML>=6.0",
    "scipy>=1.14",
    "statsmodels>=0.14",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["equity_signal_platform*"]
